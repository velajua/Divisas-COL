<!DOCTYPE html>
<html lang="en" data-locale="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divisas COL | Choose country</title>
  <meta name="description" content="Choose the country to view exchange houses and city-level exchange rates.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://divisascol.com/en/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Libre+Franklin:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../aurum-gold.css">
</head>
<body>
  <nav class="nav" id="navbar">
    <div class="container">
      <div class="nav-inner">
        <a href="/en/" class="logo">Divisas <span>COL</span></a>
        <ul class="nav-links">
          <li><a href="/en/about.html">About</a></li>
          <li><a href="/en/privacy.html">Privacy</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="country-page">
    <section class="hero" id="inicio">
      <div class="container">
        <div class="hero-content">
          <div class="hero-badge"><span class="dot"></span> Country selection</div>
          <h1 class="hero-title">Choose a country</h1>
          <p class="hero-desc">We will send you to the country homepage for this language.</p>
        </div>
      </div>
    </section>
    <section class="services" id="paises">
      <div class="container">
        <div class="section-header">
          <div class="section-label">Current coverage</div>
          <h2 class="section-title">Available countries</h2>
        </div>
        <div class="country-city-grid">
      <article class="country-city-card">
        <h2><a href="/en/colombia/">Colombia</a></h2>
        <p>5 cities with available data.</p>
      </article>
        </div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const locale = "en";
      const defaultCountry = "colombia";
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      const country = timeZone.includes("Bogota") ? "colombia" : defaultCountry;
      window.location.replace(`/${locale}/${country}/`);
    })();
  </script>
</body>
</html>
